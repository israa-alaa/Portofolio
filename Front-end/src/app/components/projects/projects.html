<section id="projects">
    <h2 class="section-title">My Projects</h2>
    <div class="projects-grid">
        @for (project of projects; track project._id ?? $index) {
            <div class="project-card">
                <div class="project-img-wrap">
                    <img [src]="project.image || 'Tic Tac Toe.png'" [alt]="project.title" class="project-image">
                </div>
                <div class="project-content">
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                    @if (project.tags && project.tags.length > 0) {
                        <div class="project-tags">
                            @for (tag of project.tags; track $index) {
                                <span class="tag">{{ tag }}</span>
                            }
                        </div>
                    }
                    <div class="project-links">
                        <a [href]="project.liveDemoUrl || '#'" target="_blank">Live Demo</a>
                        <a [href]="project.githubUrl || '#'" target="_blank">View Code</a>
                    </div>
                </div>
            </div>
        }
    </div>
</section>
